services:
  postgres:
    image: postgres:15-alpine
    container_name: ibanking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: IBankingTuitionDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ibanking-net

  redis:
    image: redis:7-alpine
    container_name: ibanking_redis
    ports:
      - "6379:6379"
    networks:
      - ibanking-net

  user-service:
    build:
      context: .
      dockerfile: src/IBankingTuition.UserService/Dockerfile
    container_name: user_service
    environment:
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=ibanking_postgres;Port=5432;Database=IBankingTuitionDb;Username=postgres;Password=password123
      - Jwt__Secret=${JWT_SECRET}
    ports:
      - "5001:80"
    depends_on:
      - postgres
    networks:
      - ibanking-net

  tuition-service:
    build:
      context: .
      dockerfile: src/IBankingTuition.TuitionService/Dockerfile
    container_name: tuition_service
    environment:
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=ibanking_postgres;Port=5432;Database=IBankingTuitionDb;Username=postgres;Password=password123
      - Jwt__Secret=${JWT_SECRET}
    ports:
      - "5002:80"
    depends_on:
      - postgres
    networks:
      - ibanking-net

  otp-service:
    build:
      context: .
      dockerfile: src/IBankingTuition.OtpService/Dockerfile
    container_name: otp_service
    environment:
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__RedisConnection=redis:6379
      - Brevo__ApiKey=${BREVO_API_KEY}
      - Brevo__FromEmail=${BREVO_FROM_EMAIL}
    ports:
      - "5003:80"
    depends_on:
      - redis
    networks:
      - ibanking-net

  payment-orchestrator:
    build:
      context: .
      dockerfile: src/IBankingTuition.PaymentOrchestrator/Dockerfile
    container_name: payment_orchestrator
    environment:
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Host=ibanking_postgres;Port=5432;Database=IBankingTuitionDb;Username=postgres;Password=password123
      - VNPay__TmnCode=${VNPAY_TMN_CODE}
      - VNPay__HashSecret=${VNPAY_HASH_SECRET}
      - VNPay__BaseUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNPay__ReturnUrl=http://localhost:5004/api/transactions/return
      - InternalServices__OtpService=http://otp-service:80
      - InternalServices__UserService=http://user-service:80
      - InternalServices__TuitionService=http://tuition-service:80
      - Brevo__ApiKey=${BREVO_API_KEY}
      - Brevo__FromEmail=${BREVO_FROM_EMAIL}
    ports:
      - "5004:80"
    depends_on:
      - postgres
    networks:
      - ibanking-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibanking_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - user-service
      - tuition-service
      - otp-service
      - payment-orchestrator

networks:
  ibanking-net:
    driver: bridge

volumes:
  postgres_data:
